<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La scatola misteriosa</title>
<style>
  :root {
    --bg-top: #fdf6e3;
    --bg-bottom: #f6e6c8;
    --box-wood: #a56a3a;
    --box-wood-dark: #7c4a24;
    --box-wood-light: #c98a52;
    --accent: #d1495b;
    --accent-dark: #a8324a;
    --ink: #3a2c22;
    --card-bg: #ffffff;
    --stage-bg: #fffaf0;
    --gold: #e0a458;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    background: radial-gradient(ellipse at top, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    overflow-x: hidden;
  }

  header {
    flex: 0 0 auto;
    text-align: center;
    margin-bottom: 8px;
  }
  h1 {
    font-size: clamp(1.3rem, 4.2vw, 2rem);
    margin: 4px 0 2px;
    color: var(--accent-dark);
    letter-spacing: 0.5px;
  }
  .subtitle {
    margin: 0;
    font-size: 0.9rem;
    opacity: 0.75;
  }

  .counter {
    flex: 0 0 auto;
    font-size: 0.85rem;
    background: var(--card-bg);
    border: 2px solid var(--gold);
    padding: 4px 14px;
    border-radius: 20px;
    margin: 8px 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .counter strong { color: var(--accent-dark); }

  .main-area {
    flex: 1 1 auto;
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 0;
  }

  /* Small clickable box */
  .box {
    position: relative;
    width: 120px;
    height: 96px;
    margin: 6px 0 4px;
    cursor: pointer;
    transition: transform 0.15s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    flex: 0 0 auto;
  }
  .box:active { transform: scale(0.96); }

  .box-lid {
    position: absolute;
    top: -20px;
    left: -6px;
    width: 132px;
    height: 30px;
    background: linear-gradient(160deg, var(--box-wood-light), var(--box-wood));
    border: 2px solid var(--box-wood-dark);
    border-radius: 6px 6px 3px 3px;
    transform-origin: bottom left;
    transition: transform 0.6s cubic-bezier(.34,1.56,.64,1);
    z-index: 5;
    box-shadow: 0 3px 5px rgba(0,0,0,0.25);
  }
  .box-lid::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 16px;
    height: 16px;
    background: var(--gold);
    border-radius: 50%;
    border: 2px solid #8a5a22;
  }
  .box.open .box-lid {
    transform: rotateX(-125deg);
  }

  .box-body {
    position: absolute;
    top: 10px;
    left: 0;
    width: 120px;
    height: 86px;
    background: linear-gradient(160deg, var(--box-wood), var(--box-wood-dark));
    border: 2px solid var(--box-wood-dark);
    border-radius: 5px;
    box-shadow: inset 0 -8px 14px rgba(0,0,0,0.3), 0 6px 10px rgba(0,0,0,0.2);
    z-index: 3;
    overflow: hidden;
  }
  .box-body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      rgba(0,0,0,0.06) 0px,
      rgba(0,0,0,0.06) 2px,
      transparent 2px,
      transparent 14px
    );
  }
  .box-inside {
    position: absolute;
    inset: 4px 4px 0 4px;
    background: #2b1c12;
    border-radius: 3px;
    z-index: 1;
  }

  .glow {
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,236,179,0.95) 0%, rgba(255,236,179,0) 70%);
    z-index: 4;
    pointer-events: none;
    opacity: 0;
  }
  .box.open .glow {
    animation: glowPop 0.6s ease-out forwards;
  }
  @keyframes glowPop {
    0% { opacity: 0; transform: translateX(-50%) scale(0.2); }
    40% { opacity: 1; transform: translateX(-50%) scale(1.3); }
    100% { opacity: 0; transform: translateX(-50%) scale(1.6); }
  }

  /* Large image reveal stage — sits in normal flow below the box, never overlaps the title */
  .image-stage {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    max-height: 58vh;
    background: var(--stage-bg);
    border: 3px dashed var(--gold);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    margin: 6px 0 14px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.12);
  }
  .image-stage .placeholder {
    font-size: clamp(2.5rem, 8vw, 4rem);
    opacity: 0.35;
  }
  .image-stage img {
    max-width: 96%;
    max-height: 96%;
    object-fit: contain;
    border-radius: 10px;
    opacity: 0;
    transform: scale(0.82);
    transition: opacity 0.5s ease, transform 0.55s cubic-bezier(.34,1.56,.64,1);
  }
  .image-stage img.show {
    opacity: 1;
    transform: scale(1);
  }

  .prompt-text {
    flex: 0 0 auto;
    min-height: 30px;
    font-size: clamp(1.05rem, 3.6vw, 1.35rem);
    font-weight: bold;
    color: var(--accent-dark);
    text-align: center;
    margin-bottom: 12px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .prompt-text.show {
    opacity: 1;
    transform: translateY(0);
  }

  .hint {
    flex: 0 0 auto;
    font-size: 0.85rem;
    text-align: center;
    opacity: 0.65;
    margin-bottom: 8px;
    min-height: 18px;
  }

  button.action {
    flex: 0 0 auto;
    background: var(--accent);
    color: white;
    border: none;
    padding: 11px 26px;
    font-size: 1rem;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.15s ease, background 0.2s ease;
    font-weight: bold;
  }
  button.action:hover { background: var(--accent-dark); }
  button.action:active { transform: scale(0.96); }
  button.action:disabled {
    background: #c9beb2;
    cursor: not-allowed;
    box-shadow: none;
  }

  .finished-msg {
    flex: 0 0 auto;
    margin-top: 14px;
    text-align: center;
    font-size: 1.05rem;
    background: var(--card-bg);
    border: 2px solid var(--gold);
    padding: 12px 18px;
    border-radius: 14px;
    max-width: 340px;
    display: none;
  }
  .finished-msg.show { display: block; }

  .reset-link {
    flex: 0 0 auto;
    margin-top: 10px;
    font-size: 0.85rem;
    color: var(--accent-dark);
    text-decoration: underline;
    cursor: pointer;
    opacity: 0.75;
    background: none;
    border: none;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #2a2118;
      --bg-bottom: #1c1712;
      --ink: #f1e6d8;
      --card-bg: #3a2f24;
      --stage-bg: #241b12;
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #2a2118;
    --bg-bottom: #1c1712;
    --ink: #f1e6d8;
    --card-bg: #3a2f24;
    --stage-bg: #241b12;
  }
</style>
</head>
<body>

  <header>
    <h1>🎁 La scatola misteriosa</h1>
    <p class="subtitle">Clicca sulla scatola per far uscire un'immagine a sorpresa!</p>
  </header>

  <div class="counter">Immagini rimaste nella scatola: <strong id="remaining">18</strong> / 18</div>

  <div class="main-area">
    <div class="box" id="box">
      <div class="box-inside"></div>
      <div class="glow"></div>
      <div class="box-body"></div>
      <div class="box-lid"></div>
    </div>

    <div class="image-stage" id="imageStage">
      <span class="placeholder" id="placeholder">🎁</span>
      <img id="revealImg" src="" alt="immagine misteriosa">
    </div>

    <div class="prompt-text" id="promptText">Ora pensa a una frase al passato prossimo!</div>
    <div class="hint" id="hint">Clicca sulla scatola per iniziare</div>

    <button class="action" id="actionBtn">Apri la scatola</button>

    <div class="finished-msg" id="finishedMsg">
      🎉 Complimenti! Avete scoperto tutte le 18 immagini della scatola misteriosa!
    </div>

    <button class="reset-link" id="resetBtn" style="display:none;">Ricomincia il gioco</button>
  </div>

  const keys = Object.keys(IMAGES);
  let remaining = [...keys];
  let isAnimating = false;
  let boxIsOpen = false;

  const box = document.getElementById('box');
  const revealImg = document.getElementById('revealImg');
  const placeholder = document.getElementById('placeholder');
  const promptText = document.getElementById('promptText');
  const hint = document.getElementById('hint');
  const actionBtn = document.getElementById('actionBtn');
  const remainingEl = document.getElementById('remaining');
  const finishedMsg = document.getElementById('finishedMsg');
  const resetBtn = document.getElementById('resetBtn');

  function updateCounter() {
    remainingEl.textContent = remaining.length;
  }

  function pickRandomImage() {
    const idx = Math.floor(Math.random() * remaining.length);
    const key = remaining[idx];
    remaining.splice(idx, 1);
    return key;
  }

  function closeBoxVisual() {
    box.classList.remove('open');
    boxIsOpen = false;
  }

  function openBox() {
    if (isAnimating) return;

    if (remaining.length === 0) {
      showFinished();
      return;
    }

    isAnimating = true;
    actionBtn.disabled = true;
    promptText.classList.remove('show');
    revealImg.classList.remove('show');
    hint.textContent = '';

    if (boxIsOpen) {
      closeBoxVisual();
      setTimeout(() => doOpen(), 350);
    } else {
      doOpen();
    }
  }

  function doOpen() {
    const key = pickRandomImage();
    box.classList.add('open');
    boxIsOpen = true;
    updateCounter();

    setTimeout(() => {
      placeholder.style.display = 'none';
      revealImg.src = 'data:image/jpeg;base64,' + IMAGES[key];
      requestAnimationFrame(() => revealImg.classList.add('show'));

      promptText.classList.add('show');
      isAnimating = false;
      if (remaining.length === 0) {
        actionBtn.textContent = 'Vedi il risultato';
        actionBtn.disabled = false;
        hint.textContent = 'Avete scoperto tutte le immagini!';
      } else {
        actionBtn.textContent = 'Apri di nuovo la scatola';
        actionBtn.disabled = false;
        hint.textContent = '';
      }
    }, 450);
  }

  function showFinished() {
    finishedMsg.classList.add('show');
    actionBtn.style.display = 'none';
    resetBtn.style.display = 'inline-block';
    promptText.classList.remove('show');
  }

  function resetGame() {
    remaining = [...keys];
    updateCounter();
    closeBoxVisual();
    revealImg.classList.remove('show');
    revealImg.src = '';
    placeholder.style.display = '';
    promptText.classList.remove('show');
    finishedMsg.classList.remove('show');
    actionBtn.style.display = 'inline-block';
    actionBtn.textContent = 'Apri la scatola';
    actionBtn.disabled = false;
    resetBtn.style.display = 'none';
    hint.textContent = 'Clicca sulla scatola per iniziare';
  }

  box.addEventListener('click', openBox);
  actionBtn.addEventListener('click', openBox);
  resetBtn.addEventListener('click', resetGame);

  updateCounter();
</script>
